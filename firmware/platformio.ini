; Firmware Sésame : ESP32 DevKit simulé dans Wokwi (§8).
; Versions épinglées pour un build reproductible sur les deux machines.

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.4.3
    madhephaestus/ESP32Servo@3.2.1
