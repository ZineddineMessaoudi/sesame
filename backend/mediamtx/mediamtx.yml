# MediaMTX (phase 2) : relaie le flux de la « caméra du portail » vers l'app.
# Seules les clés modifiées figurent ici ; les autres gardent leur valeur par défaut.
#
# Docker n'a pas accès à la webcam : ffmpeg tourne sur l'hôte et publie en RTSP
# (stream-webcam.ps1), MediaMTX le redistribue en WebRTC à l'app.

logLevel: info

# Entrée : ffmpeg publie ici (rtsp://localhost:8554/portail).
rtsp: yes
rtspAddress: :8554

# Sortie principale : WebRTC, lu en WHEP (un simple POST HTTP de l'offre SDP,
# pas de serveur de signalisation à écrire). Chiffré de bout en bout (DTLS-SRTP).
webrtc: yes
webrtcAddress: :8889
# Médias en UDP, et en TCP en repli si l'UDP ne passe pas (NAT de l'émulateur).
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Les adresses internes du conteneur sont injoignables de l'extérieur : on
# n'annonce que celles par lesquelles on joint réellement l'hôte Docker.
# 127.0.0.1 = navigateur du PC ; 10.0.2.2 = hôte vu depuis l'émulateur Android.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1, 10.0.2.2]

# Repli documenté (§2) si WebRTC échoue : HLS, plus simple mais 2 à 5 s de latence.
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

rtmp: no
srt: no

paths:
  # Nom du flux, sans rien d'identifiant (§10). Rien n'est enregistré : MediaMTX
  # ne fait que relayer, record reste à « no » (RGPD, aucune vidéo stockée).
  portail:
